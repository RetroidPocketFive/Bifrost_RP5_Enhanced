name: Android Build and Release

on:
  push:
    branches:
      - "v2/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Bifrost RP5 Edition
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Find APK
        run: find app/build/outputs -type f -name "*.apk" -print
      - name: Prepare release APK
        run: |
          mkdir -p release
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "ERROR: No debug APK was produced."; exit 1; fi
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          cp "$APK" "release/Bifrost-RP5-Edition-${SAFE_REF}.apk"
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bifrost-RP5-Edition-${{ github.ref_name }}
          path: release/*.apk
          if-no-files-found: error
      - name: Upload APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/Bifrost-RP5-Edition-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
